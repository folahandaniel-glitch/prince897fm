<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline</title>
<style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;color:#111827;padding:24px}
main{max-width:30rem;background:#fff;border:1px solid #dae0e8;border-radius:16px;padding:28px}h1{font-size:1.25rem;margin:0 0 8px}p{color:#525c6b;line-height:1.5}
button{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#12284c;color:#fff;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){body{background:#0c1018;color:#e9edf3}main{background:#161c28;border-color:#2c3546}p{color:#a0aaba}}</style></head>
<body><main><h1>You are offline</h1>
<p>WorkSuite needs a connection to load your data securely. Nothing sensitive is stored on this device for offline use. Attendance, approvals and payments always need a live connection.</p>
<button onclick="location.reload()">Try again</button></main></body></html>
